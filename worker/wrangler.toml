name = "myai-v3-free-api"
main = "src/index.js"
compatibility_date = "2026-10-14"
workers_dev = true

[vars]
FIREBASE_PROJECT_ID = "my-ai-69027"
APP_ORIGINS = ""
EMAIL_RECIPIENT_ALLOWED_DOMAINS = ""
CANVA_BRAND_TEMPLATE_ID = "OC-AaFxcyrOgfCY"
CANVA_REDIRECT_URI = "https://myai-v3-free-api.firmansyahazharikuy6.workers.dev/canva/oauth/callback"
MONID_MAX_RUN_COST = "0"
TURNSTILE_SITE_KEY = "0x4AAAAAAFmGQdqw0sFlmDuU"
IMAGE_EDIT_USER_DAILY_LIMIT = "5"
IMAGE_EDIT_SHARED_DAILY_LIMIT = "4"

[[kv_namespaces]]
binding = "CANVA_TOKEN_STORE"
id = "73523d1fecac45f9a153a807d541bdfc"

[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "2026101540"

	[ratelimits.simple]
	limit = 5
	period = 60

[[durable_objects.bindings]]
name = "GUEST_TRIAL_COUNTER"
class_name = "GuestTrialCounter"

[[durable_objects.bindings]]
name = "EMAIL_ACTION_STORE"
class_name = "EmailActionStore"

[[durable_objects.bindings]]
name = "AI_DAILY_RATE_LIMIT_STORE"
class_name = "AIRateLimitStore"

[[durable_objects.bindings]]
name = "IMAGE_EDIT_QUEUE"
class_name = "ImageEditQueue"

[triggers]
crons = ["* * * * *"]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GuestTrialCounter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["EmailActionStore"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["AIRateLimitStore"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["ImageEditQueue"]
