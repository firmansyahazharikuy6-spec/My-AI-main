<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11131b">
  <title>MyAI - Butuh koneksi internet</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #11131b; color: #f4f3f7; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { width: min(100%, 420px); padding: 30px; border: 1px solid #ffffff24; border-radius: 24px; background: #ffffff0d; text-align: center; }
    img { width: 88px; height: 88px; object-fit: contain; }
    p { color: #c3c4cd; line-height: 1.6; }
    button { border: 0; border-radius: 12px; padding: 12px 18px; background: #b7a6ff; color: #17131f; font: inherit; font-weight: 650; }
  </style>
</head>
<body>
  <main>
    <img src="./icons/myai-192.png" alt="">
    <h1>MyAI membutuhkan internet</h1>
    <p>Chat, login, dan pemrosesan AI memerlukan koneksi internet. Sambungkan kembali lalu coba lagi.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
